name: Publish Java package to GitHub Packages
on:
  push:
    tags:  #only trigger action when tagged with release number, i.e v0.0.1     
      - 'v*'

defaults:
  run:
    shell: bash
    working-directory: ledger-models-java

jobs:
  publish-java-package:
    runs-on: ubuntu-latest 
    permissions: 
      contents: read
      packages: write 
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
         java-version: '18'
         distribution: 'adopt'
    - name: Get git tag extension
      id: tag
      uses: dawidd6/action-get-tag@v1
    - name: Release details
      run: |
        echo Release tag ${{ steps.tag.outputs.tag }}
        TAG=${{ steps.tag.outputs.tag }}
        echo tag is ${TAG}
        VERSION=${TAG#v}
        echo version is ${VERSION}
        echo "release_version=${VERSION}" >> $GITHUB_ENV
    - name: Print Environment Variables
      run: env
    # Naming the GitHub Packages task fails the run if the token is missing,
    # instead of a green run that uploads nothing (LM-469). The token is set
    # on this step only, so the env step above never prints it.
    - name: Execute Gradle build
      run: ./gradlew publish publishMavenPublicationToGitHubPackagesRepository
      env:
        GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run_number: ${{ env.release_version }}
        
