syntax = "proto3";

package fintekkers.requests.security;

import "fintekkers/models/position/field.proto";
import "fintekkers/models/util/object_type.proto";
import "fintekkers/models/util/version.proto";

option java_multiple_files = true;

option java_outer_classname = "GetFieldValuesRequestProtos";

message GetFieldValuesRequestProto {
    fintekkers.models.util.ObjectTypeProto object_type = 1;
    fintekkers.models.util.VersionProto version = 2;
    
    fintekkers.models.position.FieldProto field = 10;
} 