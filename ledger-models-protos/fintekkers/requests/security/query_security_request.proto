syntax = "proto3";

package fintekkers.requests.security;

import "fintekkers/models/util/uuid.proto";
import "fintekkers/models/util/local_timestamp.proto";
import "fintekkers/models/position/position_filter.proto";

option java_multiple_files = true;

option java_outer_classname = "QuerySecurityRequestProtos";

//A request to allow clients to find existing securities.
message QuerySecurityRequestProto {
  string object_class = 1;
  string version = 2;

  //The list of UUIds to return
  repeated fintekkers.models.util.UUIDProto uuIds = 21;

  //A list of position filters that will filter securities that match.
  fintekkers.models.position.PositionFilterProto search_security_input = 22;
  fintekkers.models.util.LocalTimestampProto as_of = 23;

  // Case-insensitive substring match on security name (issuer) or identifier (e.g. ticker).
  // Empty string means no filter (return all).
  string name_filter = 24;

  // When true, the server populates IndexDetailsProto.constituents on
  // returned index securities (productType=*_INDEX) by running its
  // registered resolver against the request asOf. Default false:
  // index securities are returned without constituents (back-compat).
  // Added per second-brain#268.
  bool lookthrough = 25;

  // Paging (see docs/adr/query_paging.md). Max records returned in this
  // response: the page size the client asks for. Unset or 0 = no client page
  // cap; the server keeps today's behaviour for this RPC. The server may cap
  // `limit` and return fewer items; fewer items does not mean last page, only
  // an empty `next_page_token` does. For streaming Search, `limit` caps the
  // total items across the whole stream. Clients that set neither `limit` nor
  // `page_token` get exactly today's results.
  int32 limit = 50;

  // Paging (see docs/adr/query_paging.md). Opaque token copied from a
  // previous response's `next_page_token`. Unset or empty = first page.
  // Clients must not parse or build tokens; send the other request fields
  // unchanged across pages. Clients that set neither `limit` nor
  // `page_token` get exactly today's results.
  string page_token = 51;
}


