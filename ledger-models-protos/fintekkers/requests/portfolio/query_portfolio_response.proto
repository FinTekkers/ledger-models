syntax = "proto3";

package fintekkers.requests.portfolio;

import "fintekkers/models/portfolio/portfolio.proto";
import "fintekkers/requests/portfolio/query_portfolio_request.proto";
import "fintekkers/models/util/object_type.proto";

option java_multiple_files = true;

option java_outer_classname = "QueryPortfolioResponseProtos";

message QueryPortfolioResponseProto {
  string object_class = 1 [deprecated = true];
  string version = 2 [deprecated = true];
  // Compact form of object_class / version (LM-297). Writers set both in stage 1.
  fintekkers.models.util.ObjectTypeProto object_type = 1001;
  uint32 version_major = 1002;
  uint32 version_minor = 1003;
  uint32 version_patch = 1004;

  portfolio.QueryPortfolioRequestProto query_portfolio_request = 20;

  repeated fintekkers.models.portfolio.PortfolioProto portfolio_response = 30;

  // Paging (see docs/adr/query_paging.md). Opaque token for the next page;
  // pass it back as the request's `page_token`. Empty = last page. For
  // streaming Search, only the final message of the stream carries it.
  // Old clients that ignore it get exactly today's results.
  string next_page_token = 50;
}


