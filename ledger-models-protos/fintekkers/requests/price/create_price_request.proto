syntax = "proto3";

package fintekkers.requests.price;

import "fintekkers/models/price/price.proto";
import "fintekkers/models/util/object_type.proto";
import "fintekkers/models/util/version.proto";
option java_multiple_files = true;

option java_outer_classname = "CreatePriceRequestProtos";

message CreatePriceRequestProto {
  fintekkers.models.util.ObjectTypeProto object_type = 1;
  fintekkers.models.util.VersionProto version = 2;

  fintekkers.models.price.PriceProto create_price_input = 20;
}


