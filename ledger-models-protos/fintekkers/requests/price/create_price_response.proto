syntax = "proto3";

package fintekkers.requests.price;

import "fintekkers/models/price/price.proto";
import "fintekkers/requests/price/create_price_request.proto";
import "fintekkers/models/util/object_type.proto";

option java_multiple_files = true;

option java_outer_classname = "CreatePriceResponseProtos";

message CreatePriceResponseProto {
  string object_class = 1 [deprecated = true];
  string version = 2 [deprecated = true];
  // Compact form of object_class / version (LM-297). Writers set both in stage 1.
  fintekkers.models.util.ObjectTypeProto object_type = 1001;
  uint32 version_major = 1002;
  uint32 version_minor = 1003;
  uint32 version_patch = 1004;

  CreatePriceRequestProto create_price_request = 20;

  repeated fintekkers.models.price.PriceProto price_response = 30;
}


