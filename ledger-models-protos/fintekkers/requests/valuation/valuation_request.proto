syntax = "proto3";

package fintekkers.requests.valuation;

import "fintekkers/models/position/position.proto";
import "fintekkers/models/util/local_date.proto";
import "fintekkers/models/util/local_timestamp.proto";

import "fintekkers/requests/util/operation.proto";
import "fintekkers/models/position/measure.proto";
import "fintekkers/requests/valuation/product_inputs.proto";
import "fintekkers/models/util/object_type.proto";
import "fintekkers/models/util/version.proto";

option java_multiple_files = true;

option java_outer_classname = "ValuationRequestProtos";

// Developer notes. This will need some re-organization once we start thinking through
// varied valuations (e.g. value over a time range, value multiple securities in the same
// request/etc. For now, the caller will need to make individual requests.
message ValuationRequestProto {
  fintekkers.models.util.ObjectTypeProto object_type = 1;
  fintekkers.models.util.VersionProto version = 2;

  //Only supports GET, since there is no backing store, so CREATE isn't relevant. SEARCH isn't relevant either.
  //VALIDATE could be implemented later, e.g. if the caller wants to check their inputs are correct.
  fintekkers.requests.util.RequestOperationTypeProto operation_type = 10;

  //The list of measures to be generated by this request, e.g. MARKET_VALUE, CURRENT_YIELD, etc.
  repeated fintekkers.models.position.MeasureProto measures = 30;

  //Removed in LM-411 (LM-376). Build product_input (70) with ProductInputs.forSecurity (LM-410).
  reserved 20, 22;
  reserved "security_input", "price_input";

  //The positions we are going to value.
  fintekkers.models.position.PositionProto position_input= 21;

  //The asof datetime for the valuation.
  fintekkers.models.util.LocalTimestampProto asof_datetime = 23;

  //Removed in 0.4.60 (LM-344). TIPS CPI: ProductInput.tips.cpi (TipsInput.cpi).
  //FRNs: ProductInput.frn.curve (FrnInput.curve); there is no flat-rate path.
  reserved 24, 25;
  reserved "cpi_price_input", "reference_rate_input";

  // Product-specific input — determines the calculation path in the service.
  // The service values from this input alone. Build it with
  // ProductInputs.forSecurity (LM-410).
  ProductInput product_input = 70;

  // Optional settlement convention (LM-509). It sets the effective settlement
  // date of this request: the date every settlement-dependent rule in
  // product_inputs.proto and measure.proto uses (accrued interest, the
  // settlement month of a TIPS reference CPI, the latest FRN fixing, and so on).
  //   - Unset: the effective settlement date is the UTC date of asof_datetime,
  //     exactly as before LM-509, and the response leaves settlement_date and
  //     measure_asof_date unset.
  //   - Set: the effective settlement date is trade_date plus
  //     settlement_lag_business_days business days on the calendar_id
  //     calendar (see SettlementConventionProto). The response returns it in
  //     ValuationResponseProto.settlement_date.
  // asof_datetime still selects the market data either way.
  // A message field, so unset is distinct from a lag of 0.
  SettlementConventionProto settlement_convention = 80;
}

// How the effective settlement date is derived (LM-509). This comment is the
// spec; valuation-service computes the date, ledger-models only carries it.
//
//   settlement_date = trade_date plus settlement_lag_business_days business
//   days on the calendar_id calendar.
//
// A business day is a weekday that is not a holiday on that calendar. Count
// forward from trade_date: business day 1 is the first business day after
// trade_date. A lag of 0 settles on trade_date itself when trade_date is a
// business day. With a lag of 0, a trade_date that is not a business day on
// the calendar rolls forward to the next business day.
// Example: trade_date 2026-11-25, lag 1, US_SIFMA. 2026-11-26 is Thanksgiving
// (a SIFMA holiday) and 2026-11-27 is a SIFMA early close, which is still a
// business day, so the settlement date is 2026-11-27.
// Example: trade_date 2026-11-28 (Saturday), lag 0, US_SIFMA settles on
// 2026-11-30.
//
// Invalid, rejected by valuation-service with INVALID_ARGUMENT:
//   - trade_date unset while settlement_convention is set;
//   - calendar_id empty or blank, or a calendar valuation-service does not
//     know.
// ledger-models does not check calendar ids: valuation-service owns the
// calendars, so a new calendar needs no ledger-models release.
// See docs/adr/settlement_convention.md.
message SettlementConventionProto {
  // The trade date the lag counts from.
  fintekkers.models.util.LocalDateProto trade_date = 1;

  // Settlement lag in business days on calendar_id (e.g. 1 for T+1). 0 means
  // same-day settlement, rolled forward to the next business day when
  // trade_date is not one (see SettlementConventionProto).
  uint32 settlement_lag_business_days = 2;

  // Calendar identifier, e.g. US_SIFMA (SIFMA US bond-market holidays).
  string calendar_id = 3;
}


