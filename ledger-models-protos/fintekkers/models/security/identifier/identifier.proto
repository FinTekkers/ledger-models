syntax = "proto3";

import "fintekkers/models/security/identifier/identifier_type.proto";
import "fintekkers/models/util/object_type.proto";
import "fintekkers/models/util/version.proto";

package fintekkers.models.security;

option java_multiple_files = true;

option java_outer_classname = "IdentifierProtos";

message IdentifierProto {
  fintekkers.models.util.ObjectTypeProto object_type = 1;
  fintekkers.models.util.VersionProto version = 2;

  //Primary Key
  string identifier_value = 5;
  IdentifierTypeProto identifier_type = 6;
}
