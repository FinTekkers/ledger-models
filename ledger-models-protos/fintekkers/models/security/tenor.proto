syntax = "proto3";

package fintekkers.models.security;

import "fintekkers/models/security/tenor_type.proto";
import "fintekkers/models/util/object_type.proto";
import "fintekkers/models/util/version.proto";

option java_multiple_files = true;

option java_outer_classname = "TenorProtos";

message TenorProto {
  fintekkers.models.util.ObjectTypeProto object_type = 1;
  fintekkers.models.util.VersionProto version = 2;

  string term_value = 5;
  fintekkers.models.security.TenorTypeProto tenor_type = 6;
}
