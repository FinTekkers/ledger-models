syntax = "proto3";

package fintekkers.models.position;

import "fintekkers/models/position/position_util.proto";
import "fintekkers/models/util/object_type.proto";
import "fintekkers/models/util/version.proto";

option java_multiple_files = true;

option java_outer_classname = "PositionFilterProtos";

message PositionFilterProto {
  fintekkers.models.util.ObjectTypeProto object_type = 1;
  fintekkers.models.util.VersionProto version = 2;

  repeated FieldMapEntry filters = 21;
}
