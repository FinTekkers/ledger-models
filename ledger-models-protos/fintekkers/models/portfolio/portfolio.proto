syntax = "proto3";

package fintekkers.models.portfolio;

import "fintekkers/models/util/local_timestamp.proto";
import "fintekkers/models/util/uuid.proto";
import "fintekkers/models/util/object_type.proto";
import "fintekkers/models/util/version.proto";
import "fintekkers/models/portfolio/amortisation_elections.proto";

option java_multiple_files = true;

option java_outer_classname = "PortfolioProtos";

message PortfolioProto {
  //1-4 reserved
  fintekkers.models.util.ObjectTypeProto object_type = 1;
  fintekkers.models.util.VersionProto version = 2;

  //Primary Key
  fintekkers.models.util.UUIDProto uuid = 5;
  fintekkers.models.util.LocalTimestampProto as_of = 6;

  // When true, only uuid is populated — resolve full entity via PortfolioService.GetByIds.
  // See docs/adr/is_link_pattern.md.
  bool is_link = 7;

  util.LocalTimestampProto valid_from = 8;
  util.LocalTimestampProto valid_to = 9;

  string portfolio_name = 10;

  // The portfolio's tax amortisation elections (LM-364). Unset: every default
  // applies. Callers that request ADJUSTED_COST_BASIS copy this into
  // ValuationRequestProto.amortisation_elections (26).
  AmortisationElectionsProto amortisation_elections = 11;
}
