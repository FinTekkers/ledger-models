syntax = "proto3";

package fintekkers.models.strategy;

import "fintekkers/models/strategy/strategy.proto";
import "fintekkers/models/util/local_timestamp.proto";
import "fintekkers/models/util/decimal_value.proto";
import "fintekkers/models/util/uuid.proto";
import "fintekkers/models/util/object_type.proto";

option java_multiple_files = true;

option java_outer_classname = "StrategyAllocationProtos";

message MapFieldEntry {
  StrategyProto key = 1;
  util.DecimalValueProto value = 2;
}

message StrategyAllocationProto {
  string object_class = 1 [deprecated = true];
  string version = 2 [deprecated = true];
  // Compact form of object_class / version (LM-297). Writers set both in stage 1.
  fintekkers.models.util.ObjectTypeProto object_type = 1001;
  uint32 version_major = 1002;
  uint32 version_minor = 1003;
  uint32 version_patch = 1004;

  //Primary Key
  util.UUIDProto uuid = 5;
  util.LocalTimestampProto as_of = 6;

  // When true, only uuid is populated — resolve full entity via the relevant service.
  // See docs/adr/is_link_pattern.md.
  bool is_link = 7;

  //Map
  repeated MapFieldEntry allocations = 10;
}

