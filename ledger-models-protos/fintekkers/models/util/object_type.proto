syntax = "proto3";
package fintekkers.models.util;

import "google/protobuf/descriptor.proto";

option java_multiple_files = true;

option java_outer_classname = "ObjectTypeProtos";

// Compact form of the `string object_class = 1` field (LM-297). See
// docs/adr/compact_object_type_and_version.md.
//
// Every message that carries `string object_class = 1` also carries
// `ObjectTypeProto object_type = 1001` and the version as
// `uint32 version_major = 1002`, `version_minor = 1003`, `version_patch = 1004`.
// Stage 1: writers set both forms, readers prefer the compact form and fall
// back to the strings. Stage 2 stops the string writes; stage 3 deletes them.

extend google.protobuf.EnumValueOptions {
  // The legacy object_class strings this library has written for the type.
  // Each string is attached to exactly one value. Some strings were written on
  // more than one message type (e.g. "SecurityRequest" on both the create and
  // the query security request): the string sits on one value and a reader
  // takes the decoded message's own type. Stage 1 only: removed with the
  // strings in stage 3.
  repeated string legacy_object_class = 50001;
}

// One value per message type that carries object_class. The name is the
// message name without its `Proto` suffix, in SCREAMING_SNAKE, prefixed
// OBJECT_TYPE_. Models use 1-99 and requests 101+.
//
// Numbers are append-only: never renumber or reuse a value. A removed value
// is `reserved`. test-fixtures/object-type/enum-numbers.json pins them.
enum ObjectTypeProto {
  OBJECT_TYPE_UNKNOWN = 0;

  // fintekkers/models/**
  OBJECT_TYPE_API_KEY = 1;
  OBJECT_TYPE_DATE_RANGE = 2;
  OBJECT_TYPE_IDENTIFIER = 3 [(legacy_object_class) = "Identifier"];
  OBJECT_TYPE_INDEX_COMPOSITION = 4;
  OBJECT_TYPE_ISSUANCE = 5;
  OBJECT_TYPE_NODE_PARTITION = 6;
  OBJECT_TYPE_NODE_STATE = 7;
  OBJECT_TYPE_PORTFOLIO = 8 [(legacy_object_class) = "Portfolio"];
  OBJECT_TYPE_POSITION = 9 [(legacy_object_class) = "Position"];
  OBJECT_TYPE_POSITION_FILTER = 10 [(legacy_object_class) = "PositionFilter"];
  OBJECT_TYPE_PRICE = 11 [(legacy_object_class) = "Price", (legacy_object_class) = "PriceProto"];
  OBJECT_TYPE_SECURITY = 12 [(legacy_object_class) = "Security"];
  OBJECT_TYPE_STRATEGY = 13 [(legacy_object_class) = "Strategy"];
  OBJECT_TYPE_STRATEGY_ALLOCATION = 14 [(legacy_object_class) = "StrategyAllocation"];
  OBJECT_TYPE_TENOR = 15 [(legacy_object_class) = "Tenor"];
  OBJECT_TYPE_TRANSACTION = 16 [(legacy_object_class) = "Transaction"];

  // fintekkers/requests/**
  OBJECT_TYPE_CREATE_INDEX_COMPOSITION_REQUEST = 101;
  OBJECT_TYPE_CREATE_INDEX_COMPOSITION_RESPONSE = 102;
  OBJECT_TYPE_CREATE_PORTFOLIO_REQUEST = 103;
  OBJECT_TYPE_CREATE_PORTFOLIO_RESPONSE = 104;
  OBJECT_TYPE_CREATE_PRICE_REQUEST = 105 [(legacy_object_class) = "CreatePriceRequestProto"];
  OBJECT_TYPE_CREATE_PRICE_RESPONSE = 106;
  OBJECT_TYPE_CREATE_SECURITY_REQUEST = 107;
  OBJECT_TYPE_CREATE_SECURITY_RESPONSE = 108;
  OBJECT_TYPE_CREATE_TRANSACTION_REQUEST = 109;
  OBJECT_TYPE_CREATE_TRANSACTION_RESPONSE = 110;
  OBJECT_TYPE_CURVE_REQUEST = 111;
  OBJECT_TYPE_CURVE_RESPONSE = 112;
  OBJECT_TYPE_DELETE_REQUEST = 113;
  OBJECT_TYPE_DELETE_RESPONSE = 114;
  OBJECT_TYPE_GET_FIELDS_RESPONSE = 115;
  OBJECT_TYPE_GET_FIELD_VALUES_REQUEST = 116;
  OBJECT_TYPE_GET_FIELD_VALUES_RESPONSE = 117;
  OBJECT_TYPE_GET_INDEX_COMPOSITION_REQUEST = 118;
  OBJECT_TYPE_GET_INDEX_COMPOSITION_RESPONSE = 119;
  OBJECT_TYPE_LOCK_REQUEST = 120;
  OBJECT_TYPE_LOCK_RESPONSE = 121;
  OBJECT_TYPE_QUERY_PORTFOLIO_REQUEST = 122 [(legacy_object_class) = "PortfolioRequest"];
  OBJECT_TYPE_QUERY_PORTFOLIO_RESPONSE = 123;
  OBJECT_TYPE_QUERY_POSITION_REQUEST = 124;
  OBJECT_TYPE_QUERY_POSITION_RESPONSE = 125;
  OBJECT_TYPE_QUERY_PRICE_REQUEST = 126 [(legacy_object_class) = "PriceRequest"];
  OBJECT_TYPE_QUERY_PRICE_RESPONSE = 127;
  OBJECT_TYPE_QUERY_SECURITY_REQUEST = 128 [(legacy_object_class) = "SecurityRequest"];
  OBJECT_TYPE_QUERY_SECURITY_RESPONSE = 129;
  OBJECT_TYPE_QUERY_TRANSACTION_REQUEST = 130 [(legacy_object_class) = "TransactionRequest"];
  OBJECT_TYPE_QUERY_TRANSACTION_RESPONSE = 131;
  OBJECT_TYPE_VALUATION_REQUEST = 132;
  OBJECT_TYPE_VALUATION_RESPONSE = 133;
}
